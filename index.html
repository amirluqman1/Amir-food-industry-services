function renderEditable(root){
 root.querySelectorAll('[data-content]').forEach(slot=>{
  const value=CONTENT[slot.dataset.content];
  if(typeof value==='string'&&value.length)slot.textContent=value;
 });
 root.querySelectorAll('[data-image]').forEach(slot=>{
  const url=IMAGES[slot.dataset.image];
  if(!url)return;
  if(slot.tagName==='IMG'){slot.src=url;slot.alt=IMAGES.heroAlt;slot.hidden=false}
  else{const img=document.createElement('img');img.src=url;img.alt='';slot.append(img)}
 });
}

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lenis=new Lenis({smoothWheel:true});
function raf(t){lenis.raf(t);requestAnimationFrame(raf)}requestAnimationFrame(raf);
let scrollEnabled=true,ready=false,menu=null,modal=null,lastFocus=null;
function stopScroll(){scrollEnabled=false;lenis.stop();Object.assign(document.documentElement.style,{position:'relative',overflow:'hidden',height:'100%'})}
function startScroll(){if(!ready||menu||modal)return;scrollEnabled=true;lenis.start();['position','overflow','height'].forEach(p=>document.documentElement.style.removeProperty(p))}
stopScroll();
function applyAdaptiveGrid(){const FONT_BASE=16,baseWidth=1920,coef=.6666,w=innerWidth,widthReduction=((baseWidth-w)/baseWidth)*100,size=FONT_BASE-(FONT_BASE*(widthReduction*coef))/100;if(size>FONT_BASE)document.documentElement.style.fontSize=size+'px';else document.documentElement.style.removeProperty('font-size')}
applyAdaptiveGrid();addEventListener('resize',applyAdaptiveGrid);
function scrollTo(id){const el=document.getElementById(id);if(!el)return;scrollEnabled=false;setTimeout(()=>{window.scrollTo({top:el.getBoundingClientRect().top+pageYOffset,behavior:reduced?'instant':'smooth'});setTimeout(()=>{if(!menu&&!modal)scrollEnabled=true},100)},50)}
// One-shot scroll reveals, with separate gating for the first screen.
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target)}},{threshold:.08});
for(const root of document.querySelectorAll('.words')){let i=0;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const f=document.createDocumentFragment();node.textContent.split(/(\s+)/).forEach(word=>{if(!word.trim())f.append(document.createTextNode(word));else{const s=document.createElement('span');s.className='word';s.style.setProperty('--word',i++);s.textContent=word;f.append(s)}});node.replaceWith(f)}}

const FILL_MS=1300;let fillStart;
function finishIntro(){if(ready)return;ready=true;loader.remove();document.querySelectorAll('.hero-ready').forEach(el=>el.classList.add('visible'));startScroll()}
function progress(t){fillStart??=t;const x=Math.min((t-fillStart)/FILL_MS,1),ease=x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,p=Math.round(ease*100);fill.style.width=p+'%';number.textContent=String(p).padStart(3,'0');if(x<1)requestAnimationFrame(progress);else{loader.classList.add('leaving');setTimeout(finishIntro,reduced?0:700)}}requestAnimationFrame(progress);
// Jam dan tarikh semasa waktu Malaysia.
function tickClock(){const now=new Date(),tz={timeZone:'Asia/Kuala_Lumpur'};const t=now.toLocaleTimeString('ms-MY',{...tz,hour:'2-digit',minute:'2-digit',hour12:false}),d=now.toLocaleDateString('ms-MY',{...tz,day:'numeric',month:'short',year:'numeric'});document.querySelectorAll('.live-time').forEach(el=>el.textContent=t);const ld=document.getElementById('live-date');if(ld)ld.textContent=d}
tickClock();setInterval(tickClock,15000);
// Carousel, including keyboard access to the whole card.
const slides=[1,2,3].map(i=>({caption:CONTENT['carousel.'+i+'.caption'],title:CONTENT['carousel.'+i+'.title']}));let slide=0,carouselBusy=false;
async function changeSlide(step){if(carouselBusy)return;carouselBusy=true;const content=document.getElementById('carousel-content');const duration=reduced?0:180;await content.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:`translateY(${-Math.sign(step)*14}px)`}],{duration,fill:'forwards',easing:'ease-in'}).finished;slide=(slide+step+slides.length)%slides.length;if(slides[slide].caption)content.querySelector('p').textContent=slides[slide].caption;else if(content.querySelector('p').textContent.trim())content.querySelector('p').textContent='';if(slides[slide].title)content.querySelector('h3').textContent=slides[slide].title;else if(content.querySelector('h3').textContent.trim())content.querySelector('h3').textContent='';document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('active',i===slide));await content.animate([{opacity:0,transform:`translateY(${Math.sign(step)*14}px)`},{opacity:1,transform:'translateY(0)'}],{duration:reduced?0:400,fill:'forwards',easing:'cubic-bezier(.16,1,.3,1)'}).finished;carouselBusy=false}
document.querySelector('.card-click').addEventListener('click',()=>changeSlide(1));document.querySelector('.card-click').addEventListener('keydown',e=>{if(e.target===e.currentTarget&&(e.key==='Enter'||e.key===' ')){e.preventDefault();changeSlide(1)}});
document.getElementById('prev-card').addEventListener('click',e=>{e.stopPropagation();changeSlide(-1)});document.getElementById('next-card').addEventListener('click',e=>{e.stopPropagation();changeSlide(1)});
// Overlay lifecycle and focus management.
function backgroundInert(on){document.querySelectorAll('header,main,footer,.skip-link').forEach(el=>el.inert=on)}
function openMenu(){if(menu||modal)return;lastFocus=document.activeElement;menu=document.getElementById('nav-template').content.firstElementChild.cloneNode(true);document.body.append(menu);document.getElementById('open-menu').setAttribute('aria-expanded','true');backgroundInert(true);stopScroll();tickClock();requestAnimationFrame(()=>{menu?.classList.add('open');menu?.querySelector('[data-close-menu]').focus()})}
function closeMenu(restore=true){if(!menu)return;const old=menu;menu=null;old.inert=true;old.classList.remove('open');document.getElementById('open-menu').setAttribute('aria-expanded','false');setTimeout(()=>old.remove(),reduced?0:400);backgroundInert(!!modal);startScroll();if(restore)lastFocus?.focus()}
function openModal(){if(modal)return;if(menu)closeMenu(false);lastFocus=document.activeElement;modal=document.getElementById('modal-template').content.firstElementChild.cloneNode(true);document.body.append(modal);backgroundInert(true);stopScroll();requestAnimationFrame(()=>{modal?.classList.add('open');modal?.querySelector('input').focus()});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});modal.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const activeModal=modal,f=e.currentTarget;const text=`Salam A.F.I.S, saya ${f.name.value.trim()} (${f.phone.value.trim()}).\n\n${f.project.value.trim()}`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`,'_blank','noopener');activeModal.querySelector('.form-state').hidden=true;activeModal.querySelector('.success-state').hidden=false;activeModal.querySelector('.success-state h2').focus()})}
function closeModal(){if(!modal)return;const old=modal;modal=null;old.inert=true;old.classList.remove('open');old.classList.add('closing');setTimeout(()=>old.remove(),reduced?0:300);backgroundInert(!!menu);startScroll();if(lastFocus?.isConnected&&!lastFocus.closest('.nav-menu'))lastFocus.focus();else document.getElementById('open-menu').focus()}
document.addEventListener('click',e=>{if(e.target.closest('[data-pending-link]')){e.preventDefault();return}const contact=e.target.closest('[data-contact]');if(contact){e.preventDefault();openModal();return}if(e.target.closest('#open-menu')){openMenu();return}if(e.target.closest('[data-close-menu]')){closeMenu();return}if(e.target.closest('[data-close-modal]')){closeModal();return}const go=e.target.closest('[data-go]');if(go){e.preventDefault();const id=go.dataset.go;if(id==='contact'){openModal();return}if(menu)closeMenu();scrollTo(id);return}const anchor=e.target.closest('a[href^="#"]');if(anchor&&document.getElementById(anchor.hash.slice(1))){e.preventDefault();scrollTo(anchor.hash.slice(1))}});
document.addEventListener('keydown',e=>{const overlay=modal||menu;if(!overlay)return;if(e.key==='Escape'){e.preventDefault();modal?closeModal():closeMenu()}if(e.key==='Tab'){const focusables=[...overlay.querySelectorAll('button,a,input,textarea,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// Nombor penuh selepas separuh jarak dari bawah skrin ke tengah skrin.
let lastCount=0;function updateCounts(){const t=performance.now();if(t-lastCount<30)return;lastCount=t;document.querySelectorAll('[data-count]').forEach(el=>{if(el.dataset.count==='')return;const r=el.closest('li').getBoundingClientRect(),progress=Math.max(0,Math.min(1,(innerHeight-r.top)/((innerHeight/2+r.height/2)/2)));el.textContent=Math.round(progress*Number(el.dataset.count))})}addEventListener('scroll',updateCounts,{passive:true});addEventListener('resize',updateCounts);updateCounts();
// Kesan berus hanya diaktifkan apabila kedua-dua gambar telah diisi.
if(!reduced&&IMAGES.heroBase&&IMAGES.heroReveal){const container=document.getElementById('liquid'),canvas=container.querySelector('canvas'),ctx=canvas.getContext('2d'),cover=document.createElement('canvas'),coverCtx=cover.getContext('2d'),brush=document.createElement('canvas'),brushCtx=brush.getContext('2d'),image=new Image();const brushRadius=143,decay=.016;let dpr=1,radius=143,diameter=286,rect,last=null,points=[],idle=121,frame=0,imageReady=false;
function measure(){rect=container.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);cover.width=canvas.width;cover.height=canvas.height;radius=brushRadius*dpr;diameter=Math.ceil(radius*2);brush.width=brush.height=diameter;points=[];last=null;idle=121;if(imageReady){const s=Math.max(cover.width/image.naturalWidth,cover.height/image.naturalHeight),w=image.naturalWidth*s,h=image.naturalHeight*s;coverCtx.drawImage(image,(cover.width-w)/2,(cover.height-h)/2,w,h)}}
new ResizeObserver(measure).observe(container);image.onload=()=>{imageReady=true;measure()};image.src=IMAGES.heroReveal;
function stamp(x,y){const c=diameter/2;brushCtx.clearRect(0,0,diameter,diameter);brushCtx.globalCompositeOperation='source-over';const gradient=brushCtx.createRadialGradient(c,c,0,c,c,radius);gradient.addColorStop(0,'rgba(255,255,255,1)');gradient.addColorStop(.55,'rgba(255,255,255,.82)');gradient.addColorStop(1,'rgba(255,255,255,0)');brushCtx.fillStyle=gradient;brushCtx.fillRect(0,0,diameter,diameter);brushCtx.globalCompositeOperation='source-in';brushCtx.drawImage(cover,x-c,y-c,diameter,diameter,0,0,diameter,diameter);ctx.globalCompositeOperation='source-over';ctx.drawImage(brush,x-c,y-c)}
function tick(){frame=0;const drawing=points.length>0;if(drawing)idle=0;else idle++;if(idle>120)return;const fade=drawing?decay:Math.min(decay+idle*.004,.5);ctx.globalCompositeOperation='destination-out';ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,canvas.width,canvas.height);if(drawing){for(const p of points)stamp(p.x,p.y);points=[]}if(idle>=120)ctx.clearRect(0,0,canvas.width,canvas.height);else frame=requestAnimationFrame(tick)}
addEventListener('pointermove',e=>{if(!imageReady||!ready||menu||modal)return;rect=container.getBoundingClientRect();const x=(e.clientX-rect.left)*dpr,y=(e.clientY-rect.top)*dpr;if(x < -radius||y < -radius||x>canvas.width+radius||y>canvas.height+radius){last=null;return}if(last){const dist=Math.hypot(x-last.x,y-last.y),step=Math.max(radius*.3,1),n=Math.min(Math.ceil(dist/step),60);for(let i=1;i<=n;i++)points.push({x:last.x+(x-last.x)*i/n,y:last.y+(y-last.y)*i/n})}else points.push({x,y});last={x,y};if(!frame)frame=requestAnimationFrame(tick)},{passive:true});addEventListener('pointerout',e=>{if(!e.relatedTarget)last=null})}
</script>
