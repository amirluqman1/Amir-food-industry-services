addEventListener('pointermove',e=>{if(!imageReady||!ready||menu||modal)return;rect=container.getBoundingClientRect();const x=(e.clientX-rect.left)*dpr,y=(e.clientY-rect.top)*dpr;if(x < -radius||y < -radius||x>canvas.width+radius||y>canvas.height+radius){last=null;return}if(last){const dist=Math.hypot(x-last.x,y-last.y),step=Math.max(radius*.3,1),n=Math.min(Math.ceil(dist/step),60);for(let i=1;i<=n;i++)points.push({x:last.x+(x-last.x)*i/n,y:last.y+(y-last.y)*i/n})}else points.push({x,y});last={x,y};if(!frame)frame=requestAnimationFrame(tick)},{passive:true});addEventListener('pointerout',e=>{if(!e.relatedTarget)last=null})}
</script>
